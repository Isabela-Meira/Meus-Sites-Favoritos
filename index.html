
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Configuração dos caracteres -->
    <meta charset="UTF-8">

    <!-- Adaptação para dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título da aba do navegador -->
    <title>Meus Sites Favoritos</title>

    <!-- Arquivo responsável pela aparência da página -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Cabeçalho da página -->
    <header>

    <!-- Conteúdo principal -->
    <main class="container">

        <!-- Primeiro site: GitHub -->
        <section class="site">
            <h2>GitHub</h2>

            <a href="https://github.com/" target="_blank">
                <img src="imagens/github.png"
                     alt="Logo do GitHub">
            </a>

            <a class="link" href="https://github.com/"
               target="_blank">
                Acessar GitHub
            </a>
        </section>

        <!-- Segundo site: YouTube -->
        <section class="site">
            <h2>YouTube</h2>

            <a href="https://www.youtube.com/" target="_blank">
                <img src="imagens/youtube.png"
                     alt="Logo do YouTube">
            </a>

            <a class="link" href="https://www.youtube.com/"
               target="_blank">
                Acessar YouTube
            </a>
        </section>

        <!-- Terceiro site: Kultivi -->
        <section class="site">
            <h2>Kultivi</h2>

            <a href="https://kultivi.com/" target="_blank">
                <img src="imagens/kultivi.png"

            </a>

            <a class="link" href="https://kultivi.com/"
               target="_blank">
                Acessar Kultivi
            </a>
        </section>

        <!-- Quarto site: ETEC EAD -->
        <section class="site">
            <h2>ETEC EAD</h2>

            <a href="https://eadtec.cps.sp.gov.br/home.php"
               target="_blank">
                <img src="imagens/etec.png"
                     alt="Logo da ETEC">
            </a>

            <a class="link"
               href="https://eadtec.cps.sp.gov.br/home.php"
               target="_blank">
                Acessar ETEC EAD
            </a>
        </section>

        <!-- Quinto site: G1 -->
        <section class="site">
            <h2>G1</h2>

            <a href="https://g1.globo.com/" target="_blank">
                <img src="imagens/g1.png"
                     alt="Logo do G1">
            </a>

            <a class="link" href="https://g1.globo.com/"
               target="_blank">
                Acessar G1
            </a>
        </section>

    </main>

    <!-- Rodapé -->
    <footer>
        <p>Desenvolvido por Isabela Meira - Nov 2026</p>
    </footer>

</body>
</html>
